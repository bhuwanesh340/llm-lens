[project]
name = "llm-lens"
version = "0.1.0"
description = "Decorator-based nested tracing SDK for LLM Lens"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "ruff>=0.9,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_lens"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["llm_lens", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["llm_lens"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
